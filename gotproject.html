<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
   
</head>
<body>
    <div class="container contact-section">
        <div class="row align-items-center">
            <div class="col-md-6">
                <h2><strong>Got a project in</strong> <span style="color:#00B4D8;">mind?</span></h2>
                <img src="https://placehold.co/600x400" class="img-fluid" alt="Illustration">
            </div>
            <div class="col-md-6">
                <div class="contact-card">
                    <form>
                        <div class="mb-3">
                            <label class="form-label">Your name</label>
                            <input type="text" class="form-control" placeholder="Name">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Your email</label>
                            <input type="email" class="form-control" placeholder="Email">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Your Message</label>
                            <textarea class="form-control" rows="4" placeholder="Message"></textarea>
                        </div>
                        <button type="submit" class="send-btn">Send Message ✈️</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
    
    <footer class="footer">
        <div class="container">
            <div class="d-flex justify-content-center">
                <a href="#">Home</a> | <a href="#">About me</a> | <a href="#">Contact</a>
            </div>
            <div class="social-icons mt-3">
                <a href="#"><i class="fab fa-facebook"></i></a>
                <a href="#"><i class="fab fa-instagram"></i></a>
                <a href="#"><i class="fab fa-twitter"></i></a>
                <a href="#"><i class="fab fa-youtube"></i></a>
            </div>
            <p class="mt-3">Terms of Service - Privacy Policy</p>
        </div>
    </footer>
    
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
